[project]
name = "ridewithubt"
version = "0.3.0"
description = "Offline-first virtual world for indoor cycling training"
authors = [{ name = "Denis Chernykh", email = "education03@mail.ru" }]
requires-python = ">=3.14,<4"
dependencies = [
    "bleak>=1.1,<2",
    "garminconnect>=0.2.39,<0.4.0",
    "keyring>=25.6,<26",
    "openant>=1.3,<2",
    "panda3d>=1.10.16,<2",
    "polib>=1.2,<2",
    "stravalib>=2.4,<3",
]

[project.scripts]
ridewithubt = "app.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.15.12,<0.17",
    "pre-commit>=4.6.0,<5",
    "mypy>=1.20.2,<3.0.0",
    "types-polib>=1.2,<2",
    "commitizen>=4.13.10,<5",
    "pytest>=9.0.3,<10",
    "pytest-xdist>=3.8.0,<4",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-cov>=7.1.0,<8",
    # An independent FIT reader, used only to check what our writer produces: a
    # writer verified against its own reader agrees with itself and nothing else.
    "python-fitparse>=2.1,<3",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = ["app"]
module-root = ""

# Build the project with uv's backend so its console script (project.scripts) installs under uv.
[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "C90", # McCabe cyclomatic complexity
    "UP",  # pyupgrade - modernise syntax for target Python version
    "B",   # flake8-bugbear - common bugs and design issues
    "S",   # flake8-bandit - security
    "PTH", # flake8-use-pathlib - prefer pathlib over os.path
    "RUF", # Ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
ignore_missing_imports = true

[tool.coverage.run]
parallel = true
# The Panda3D frontend is not exercised by the unit suite: creating a ShowBase is
# process-global and does not survive pytest-xdist workers. It is covered instead by the
# smoke launch of the frozen app in CI (.github/workflows/build.yml).
omit = [
    "app/render/*",
    # Drives an ANT+ USB stick through openant: no stick, nothing to run.
    "app/sensors/ant_radio.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-n auto --cov=app --cov-fail-under=90 --cov-report=term-missing"
markers = ["debug: mark test for local debugging and run it in isolation"]
